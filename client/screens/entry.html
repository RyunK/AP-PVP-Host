
<section id="screen-entry" class="screen-entry">
  <h1>전투 대기실 입장</h1>
  <label class="field">
    <span>닉네임</span>
    <input type="text" id="nameInput" placeholder="플레이어 이름" maxlength="12" />
  </label>
  <label class="field password-input-wrap">
    <span>비밀번호</span>
    <input type="password" id="passwordInput" placeholder="비밀번호" />
    <button type="button" class="password-toggle-btn" id="pwToggleBtn"><i class="fas fa-eye"></i></button>
  </label>

  <div class="entry-actions">
    <button class="btn btn-primary" id="enterBtn">방 참가하기</button>
  </div>
  <p class="error" id="entryError"></p>
</section>
