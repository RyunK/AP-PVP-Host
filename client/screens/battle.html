
<section id="screen-battle">
  <div class="lobby-layout">
    <div class="lobby-main">
      <div class="room-header">
        <span>내 정보</span>
        <strong id="myInfoLabel"></strong>
      </div>

      <div class="battle-header">
        <h2>라운드 <span id="turnNumber">1</span>, <span id="phaseLabel">선공</span>페이즈 | 
          <span id="nowTurn">A팀</span>의 순서 | <span id="turnTimer">00:00</span></h2>
      </div>
      <span id="battleStatus" class="hint"></span>
      <div id="myCharacters" class="my-characters"></div>
      <h2>전체 현황</h2>
      <div id="rosterBoard"></div> <!-- 요구사항 1: 모든 캐릭터 스탯/HP -->

      <h2>우리 팀 행동</h2>
      <div id="myTeamActions"></div> <!-- 요구사항 2: 실시간 draft + confirmed -->

      <h2>상대 팀 행동</h2>
      <div id="enemyTeamActions"></div> <!-- 요구사항 3: confirmed만 -->

      <div id="myActionPanel"></div> <!-- 내 캐릭터 액션 선택 UI -->
      <!-- <div id="battleLog" class="battle-log"></div> -->
    </div>

    <div class="lobby-side">
      <div id="playerListContainer" class="player-list-container">
        <!-- <h2>플레이어 목록</h2> -->
      </div>
      <div id="chatContainer" class="chat-container">
        <!-- <h2>채팅 내용</h2> -->
      </div>
    </div>

  </div>
</section>
