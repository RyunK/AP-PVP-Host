<div class="alert-modal"></div>

<div id="phaseAlert" class="phase-alert">
    <div class="phase-alert__scanline"></div>

    <div class="phase-alert__box">
        <div class="phase-alert__header">
        <span class="phase-alert__status">SYSTEM MESSAGE</span>
        <span class="phase-alert__code">ROUND // 01</span>
        </div>

        <div class="phase-alert__content">
        <div class="phase-alert__label">PHASE FORWARDED</div>
        <div id="phaseAlertTitle" class="phase-alert__title">
            VANGUARD PHASE
        </div>
        <div id="phaseAlertMessage" class="phase-alert__message">
            선공 페이즈 시작.
        </div>
        </div>

        <div class="phase-alert__footer">
        <span>◈ SYSTEM READY</span>
        <span id="phaseAlertDots">...</span>
        </div>
    </div>
</div>


<section id="screen-battle">
  <div class="lobby-layout">
    <div class="lobby-main">
      <div class="room-header">
        <span>내 정보</span>
        <strong id="myInfoLabel"></strong>
      </div>

      <div class="battle-header">
        <h2>라운드 <span id="turnNumber">1</span>, <span id="phaseLabel">-</span>페이즈 | 
          <span id="nowTurn">-</span>의 순서 | <span id="turnTimer">00:00</span></h2>
      </div>
      <span id="battleStatus" class="hint"></span>
      <div id="myCharacters" class="my-characters"></div>
      <h2>현재 상태</h2>
      <div id="rosterBoard"></div>
    </div>

    <div class="lobby-side">
      <div id="playerListContainer" class="player-list-container">
        <!-- <h2>플레이어 목록</h2> -->
      </div>
      <div id="chatContainer" class="chat-container">
        <!-- <h2>채팅 내용</h2> -->
      </div>
    </div>

  </div>
</section>
