
<!-- 대기실 (캐릭터/팀 설정) -->

<div id="charInfoModal" class="modal-overlay" style="display:none"></div>

<section id="screen-lobby">
  <h2>내 캐릭터 설정</h2>
  <p class="hint">최대 인원만큼 캐릭터를 등록하면, 그 캐릭터들을 모두 직접 조작합니다.</p>
  <div id="characterForm"></div>
  <button class="btn btn-ghost" id="addCharacterBtn">캐릭터 추가</button>
  <button class="btn btn-primary" id="saveCharactersBtn">캐릭터 저장</button>

  <h2>내 캐릭터 목록</h2>
  <div id="myCharacterList"></div>

  <h2>팀 배정</h2>
  <div id="teamBoard" class="team-board"></div>
  <div id="unassignedBoard" class="unassigned-board"></div>

  <button id="startBattleBtn" style="display:none" class="btn btn-primary">게임 시작</button>
  <button id="readyBtn" style="display:none" class="btn btn-primary">준비 완료</button>
  <p class="hint" id="lobbyStatus"></p>

  <div id="playerListContainer">
    <h2>플레이어 목록</h2>
  </div>
  <div id="chatContainer">
    <h2>채팅 내용</h2>
  </div>
</section>
